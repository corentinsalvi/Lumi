<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <link rel="icon" href="logo-fonce.png" type="image/png"/>
  <title>Odoggy — Inscription (Étape 3)</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,300;0,700;0,900;1,400&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
  <link rel="stylesheet" href="style.css"/>
</head>
<body>
  <div class="page-wrap">
    <div class="card">

      <!-- Logo -->
      <div class="logo-block">
        <img src="logo-fonce.png" alt="Odoggy Logo" class="logo-img" />
        <h1 class="logo">Odoggy</h1>
      </div>

      <!-- Titre formulaire -->
      <p class="form-sub">À propos de <span id="dogName"></span></p>

      <!-- Messages flash -->
      <div id="flash" class="flash hidden"></div>

      <!-- Formulaire -->
      <form id="chienInfoForm" novalidate>

        <!-- Race -->
        <div class="field-group">
          <label for="race">Race <span class="required">*</span></label>
          <div class="input-wrap">
            <i class="fa-solid fa-bone"></i>
            <input type="text" id="race" name="race" placeholder="Ex : Labrador, Berger Allemand…" required />
          </div>
          <div class="field-error" id="err-race"></div>
        </div>

        <!-- Poids -->
        <div class="field-group">
          <label for="poids">Poids (en kg) <span class="required">*</span></label>
          <div class="input-wrap">
            <i class="fa-solid fa-weight"></i>
            <input type="number" id="poids" name="poids" placeholder="Ex : 25" min="0.5" max="200" step="0.5" required />
          </div>
          <div class="field-error" id="err-poids"></div>
        </div>

        <!-- Date de naissance -->
        <div class="field-group">
          <label for="dateNaissance">Date de naissance <span class="required">*</span></label>
          <div class="input-wrap">
            <i class="fa-solid fa-calendar"></i>
            <input type="date" id="dateNaissance" name="dateNaissance" required />
          </div>
          <div class="field-error" id="err-dateNaissance"></div>
        </div>

        <!-- Sexe -->
        <div class="field-group">
          <label>Sexe <span class="required">*</span></label>
          <div style="display: flex; gap: 12px; margin-top: 8px;">
            <label style="display: flex; align-items: center; cursor: pointer; flex: 1; gap: 8px;">
              <input type="radio" name="sexe" value="male" id="sexe-male" required />
              <span style="font-size: 14px;">♂️ Mâle</span>
            </label>
            <label style="display: flex; align-items: center; cursor: pointer; flex: 1; gap: 8px;">
              <input type="radio" name="sexe" value="femelle" id="sexe-femelle" required />
              <span style="font-size: 14px;">♀️ Femelle</span>
            </label>
          </div>
          <div class="field-error" id="err-sexe"></div>
        </div>

        <!-- Boutons navigation -->
        <div class="button-group">
          <button type="button" class="btn-secondary" id="btnBack">← Retour</button>
          <button type="submit" class="btn-submit" id="submitBtn">
            <span class="btn-text">Créer mon compte 🐾</span>
            <span class="btn-loader hidden" id="btnLoader">⏳ Envoi en cours…</span>
          </button>
        </div>

      </form>

    </div>
  </div>

  <script src="chien-info.js"></script>
</body>
</html>
