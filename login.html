<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <link rel="icon" href="logo-fonce.png" type="image/png"/>
  <title>Odoggy — Connexion</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,300;0,700;0,900;1,400&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
  <link rel="stylesheet" href="style.css"/>
</head>
<body>
  <div class="page-wrap">
    <div class="card">

      <!-- Logo -->
      <div class="logo-block">
        <img src="logo-fonce.png" alt="Odoggy Logo" class="logo-img" />
        <h1 class="logo">Odoggy</h1>
      </div>

      <!-- Titre formulaire -->
      <h2 class="form-title">Se connecter</h2>
      <p class="form-sub">Bienvenue sur Odoggy</p>

      <!-- Messages flash -->
      <div id="flash" class="flash hidden"></div>

      <!-- Formulaire -->
      <form id="loginForm" novalidate>

        <!-- Email -->
        <div class="field-group">
          <label for="email">Adresse e-mail <span class="required">*</span></label>
          <div class="input-wrap">
            <i class="fa-solid fa-envelope"></i>
            <input type="email" id="email" name="email" placeholder="vous@exemple.fr" autocomplete="email" required />
          </div>
          <div class="field-error" id="err-email"></div>
        </div>

        <!-- Mot de passe -->
        <div class="field-group">
          <label for="mot_de_passe">Mot de passe <span class="required">*</span></label>
          <div class="input-wrap">
            <i class="fa-solid fa-lock"></i>
            <input type="password" id="mot_de_passe" name="mot_de_passe" placeholder="Votre mot de passe" required />
            <button type="button" class="toggle-pwd" id="togglePwd" aria-label="Afficher le mot de passe"><i class="fa-solid fa-eye-slash"></i></button>
          </div>
          <div class="field-error" id="err-mot_de_passe"></div>
        </div>

        <!-- Bouton submit -->
        <button type="submit" class="btn-submit" id="submitBtn">
          <span class="btn-text">Se connecter</span>
          <span class="btn-loader hidden" id="btnLoader">⏳ Connexion…</span>
        </button>

      </form>

      <p class="login-link">Pas encore inscrit ? <a href="/inscription" class="link">Créer un compte</a></p>

    </div>
  </div>

  <script src="login.js"></script>
</body>
</html>
